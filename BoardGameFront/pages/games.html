<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог игр - BoardGamesWiki</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header id="header-placeholder"></header>

    <main class="container-md my-4 flex-grow-1">
        <div class="row">
            
            <div class="col-lg-3 mb-4">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary">
                        <h5 class="mb-0">Фильтры</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label text-light">Поиск по названию</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Например, Уно">
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light d-block mb-2">Количество игроков</label>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="player1">
                                <label class="form-check-label text-secondary" for="player1">Для одного</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="player2">
                                <label class="form-check-label text-secondary" for="player2">Для двоих</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="player4">
                                <label class="form-check-label text-secondary" for="player4">Для компании (4+)</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light">Сортировка</label>
                            <select class="form-select bg-dark text-light border-secondary">
                                <option>По алфавиту (А-Я)</option>
                                <option>По алфавиту (Я-А)</option>
                                <option>По рейтингу (сначала высокие)</option>
                                <option>По новизне (сначала новые)</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" type="button">Применить</button>
                            <button class="btn btn-outline-secondary" type="button">Сбросить</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <h2 class="mb-4">Все игры</h2>
                
                <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                    <div class="col">
                        <div class="card h-100 bg-dark border-secondary">
                            <img src="" class="card-img-top" alt="">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">Название</h5>
                                <p class="card-text text-secondary small mb-3">x-x игроков</p>
                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <span class="badge bg-success">x / 10</span>
                                    <a href="game.html" class="btn btn-sm btn-outline-primary">Подробнее</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <nav class="mt-5 d-flex justify-content-center">
                    <ul class="pagination">
                        <li class="page-item disabled">
                            <a class="page-link bg-dark text-light border-secondary" href="#" tabindex="-1" aria-disabled="true">Назад</a>
                        </li>
                        <li class="page-item active" aria-current="page">
                            <a class="page-link bg-primary border-primary" href="#">1</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link bg-dark text-light border-secondary" href="#">2</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link bg-dark text-light border-secondary" href="#">3</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link bg-dark text-light border-secondary" href="#">Вперед</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder" class="mt-auto"></footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../includes/header.html')
            .then(response => response.text())
            .then(html => document.getElementById('header-placeholder').innerHTML = html)
            .catch(error => console.error('Ошибка загрузки хедера:', error));

        fetch('../includes/footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer-placeholder').innerHTML = html)
            .catch(error => console.error('Ошибка загрузки футера:', error));
    </script>
</body>

</html>
